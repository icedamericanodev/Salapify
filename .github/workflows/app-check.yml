name: App check

# The branch gate for app/, Salapify 3.
#
# Deliberately has NO paths filter, the same reasoning as flutter-check.yml: a
# workflow skipped by a paths filter reports as "no check", and no check reads
# like approval. It is cheap, so it runs.
#
# This is analyze and test only. It publishes nothing, because there is nothing
# to publish yet: app/ has no publisher, no Shorebird app id and no stamp until
# Phase D. When that arrives, the stamp uniqueness guard and the delivery log
# row come with it, and this file gains the same checks flutter-check.yml has.

on:
  push:
    branches: ['claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push and pull_request fire for the same commit, so dedupe them. Cancelling is
# safe here precisely because nothing is published.
concurrency:
  group: app-check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    # See flutter-check.yml for why: GitHub's default is six HOURS, so without
    # this a hang blocks every merge while looking like a slow build. This job
    # takes about two minutes.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The pin, and it is not a preference. Shorebird decides which Flutter
      # version the app can ship on, so this number lags stable and moving it
      # forces a new base APK. It must match every other pin in this repo.
      - uses: subosito/flutter-action@9a48871cbeff8679f6337339dc79b806ad9a9a13 # v2.9.1
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      # pub get rewrites pubspec.lock to whichever SDK ran it, and from 3.47
      # also writes an analyzer.exclude block into analysis_options.yaml.
      # Neither analyze nor test notices, so the tree is checked directly.
      - name: pub get on the pinned SDK leaves the tree clean
        run: |
          flutter pub get
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- app/pubspec.lock app/analysis_options.yaml; then
            echo "::error::pub get on the pinned SDK changed pubspec.lock or analysis_options.yaml."
            echo "Commit the result, or you are testing a tree the runner will not build."
            git --no-pager diff -- app/pubspec.lock app/analysis_options.yaml
            exit 1
          fi

      - name: Analyze (zero tolerance)
        run: flutter analyze

      - name: Test
        run: flutter test

      # The screenshot harness is deliberately excluded from `flutter test`
      # (it is not named *_test.dart), so nothing else ever runs it. That is
      # the same silence that let the older app's harness be abandoned once
      # already: it appeared to hang, the reason was never written down, and
      # the founder was the only pair of eyes on the app for two rounds.
      #
      # analyze covers the compile-time half. This covers the RUNTIME half:
      # that the real fonts still load, the router still builds, and a screen
      # still renders to actual pixels.
      #
      # --update-goldens is load-bearing, not a shortcut. The harness ends in
      # matchesGoldenFile and test/shots/out is gitignored, so without the flag
      # a fresh checkout compares against files that do not exist and fails for
      # a reason that says nothing about the app. With it, the step only
      # writes, and the only way it can fail is if the harness genuinely
      # stopped working.
      - name: The screenshot harness still renders
        run: flutter test test/shots/screens_shot.dart --update-goldens

      # THE BYTE FOR BYTE ENGINE COMPARISON LIVED HERE AND IS GONE, on the
      # schedule its own comment set.
      #
      # It compared app/'s money fixtures against the ones the shipped Salapify
      # 2 app used, and the comment that stood here said in as many words:
      # "This step dies with flutter/ at cutover, and by then the vectors will
      # have been green against two independent implementations for months,
      # which is the only reason it is safe to lose."
      #
      # This commit is that cutover. flutter/ is now archive/salapify-2-flutter
      # and .github/scripts/check-engine-identical.sh is now in that archive's
      # ci-disabled/scripts/, so the step cannot run and should not: there is
      # no second implementation left to be identical to.
      #
      # This is the ONLY change to this file in stage one, and it is here
      # because the archive move is what broke the step. The rest of
      # app-check.yml, including its Flutter pin, stays exactly as main has it,
      # because the newer version of this file builds app/ under a newer SDK
      # and main's app/ is 307 commits behind. That version travels with app/
      # in stage two.
      #
      # What still guards the money: the golden vectors themselves, which are
      # generated by running the prototype's own TypeScript and are replayed by
      # app/test on every branch push.
