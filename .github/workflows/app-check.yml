name: App check

# The branch gate for app/, Salapify 3.
#
# Deliberately has NO paths filter, the same reasoning as flutter-check.yml: a
# workflow skipped by a paths filter reports as "no check", and no check reads
# like approval. It is cheap, so it runs.
#
# This is analyze and test only. It publishes nothing, because there is nothing
# to publish yet: app/ has no publisher, no Shorebird app id and no stamp until
# Phase D. When that arrives, the stamp uniqueness guard and the delivery log
# row come with it, and this file gains the same checks flutter-check.yml has.

on:
  push:
    branches: ['claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push and pull_request fire for the same commit, so dedupe them. Cancelling is
# safe here precisely because nothing is published.
concurrency:
  group: app-check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    # See flutter-check.yml for why: GitHub's default is six HOURS, so without
    # this a hang blocks every merge while looking like a slow build. This job
    # takes about two minutes.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # THIS PIN DELIBERATELY DOES NOT MATCH THE REST OF THE REPOSITORY, and
      # that is the one exception, argued rather than assumed.
      #
      # Everywhere else pins 3.44.6 because SHOREBIRD sets that number: the
      # shipped app delivers over the air with
      # `shorebird release android --flutter-version 3.44.6`, and Shorebird can
      # only build versions it has published support for. Raising those pins
      # would break delivery outright, which is the 2026-08-16 decision in
      # docs/decision-log.md and it still stands.
      #
      # app/ is not that app. It has no Shorebird publisher, no app id and no
      # update stamp, so there is no shipping toolchain for this check to
      # diverge FROM. What it can diverge from is the founder's machine, which
      # runs 3.47.4 and is the only place this app runs at all. Testing on
      # 3.44.6 meant CI proving the app works on a Flutter nobody uses.
      #
      # The 2026-08-16 decision rejected raising only the branch check, and
      # this does not contradict it: that objection was about flutter-check.yml
      # splitting from the version that actually ships. Here there is nothing
      # shipping to split from.
      #
      # WHEN app/ GAINS SHOREBIRD (Phase D), this pin stops being free. It must
      # come back down to whatever Shorebird supports at that moment, and the
      # committed pubspec.lock and analysis_options.yaml must be regenerated on
      # that SDK in the same commit.
      - uses: subosito/flutter-action@9a48871cbeff8679f6337339dc79b806ad9a9a13 # v2.9.1
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # pub get rewrites pubspec.lock to whichever SDK ran it, and from 3.47
      # also writes an analyzer.exclude block into analysis_options.yaml.
      # Neither analyze nor test notices, so the tree is checked directly.
      - name: pub get on the pinned SDK leaves the tree clean
        run: |
          flutter pub get
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- app/pubspec.lock app/analysis_options.yaml; then
            echo "::error::pub get on the pinned SDK changed pubspec.lock or analysis_options.yaml."
            echo "Commit the result, or you are testing a tree the runner will not build."
            git --no-pager diff -- app/pubspec.lock app/analysis_options.yaml
            exit 1
          fi

      - name: Analyze (zero tolerance)
        run: flutter analyze

      - name: Test
        run: flutter test

      # The screenshot harness is deliberately excluded from `flutter test`
      # (it is not named *_test.dart), so nothing else ever runs it. That is
      # the same silence that let the older app's harness be abandoned once
      # already: it appeared to hang, the reason was never written down, and
      # the founder was the only pair of eyes on the app for two rounds.
      #
      # analyze covers the compile-time half. This covers the RUNTIME half:
      # that the real fonts still load, the router still builds, and a screen
      # still renders to actual pixels.
      #
      # --update-goldens is load-bearing, not a shortcut. The harness ends in
      # matchesGoldenFile and test/shots/out is gitignored, so without the flag
      # a fresh checkout compares against files that do not exist and fails for
      # a reason that says nothing about the app. With it, the step only
      # writes, and the only way it can fail is if the harness genuinely
      # stopped working.
      - name: The screenshot harness still renders
        run: flutter test test/shots/screens_shot.dart --update-goldens

      # The byte-for-byte engine comparison against flutter/ used to run here
      # and has been REMOVED, deliberately, rather than left to skip quietly.
      #
      # It existed because app/ was a port of the shipped Flutter app, and its
      # whole guarantee was that not one number moved. That premise is gone:
      # by founder direction on 2026-09-18, app/ is now rebuilt from the Google
      # AI Studio prototype in src/, which is the new source of truth for every
      # calculation. An engine file in app/ is SUPPOSED to differ from
      # flutter/ now, so the old check could only ever be noise.
      #
      # check-engine-identical.sh self-exits 0 when app/lib/core/money is
      # absent, so leaving the step in place would have looked like a passing
      # check while comparing nothing at all. A check that silently compares
      # nothing reads exactly like approval, which is the failure mode this
      # repository has been bitten by before. Deleting the step says so out
      # loud instead.
      #
      # What replaces it is a REAL comparison, in the test suite rather than
      # here: test/engine/safe_to_spend_golden_test.dart locks the Dart port to
      # vectors generated by running the prototype's own TypeScript under bun.
      # Every ported engine gets the same treatment as it lands.

  # THE NATIVE HALF, added 2026-09-19 with flutter_local_notifications.
  #
  # Until that plugin landed, app/ was pure Dart plus path_provider and
  # friends, and analyze plus test really did cover it. It does not any more.
  # A notification plugin brings a Gradle requirement (core library
  # desugaring), a manifest merge (two permissions and two receivers) and a
  # plugin registration, and NOT ONE of those three can fail a Dart analyze or
  # a widget test. They fail at `flutter build apk`, and without this job the
  # first thing to discover that would be the founder's own machine.
  #
  # The dev sandbox has no Android SDK at all, so this cannot be checked
  # locally either. That is precisely why it belongs on a runner.
  #
  # Debug, not release: the release build is signed with the debug key today
  # and a real upload keystore is still outstanding. This job's job is to
  # compile the native side, not to produce something installable.
  android:
    name: Android build
    runs-on: ubuntu-latest
    # An Android build is minutes rather than seconds, so it gets its own job
    # and runs beside the fast one rather than delaying it.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      # Same pin and same argument as the job above.
      - uses: subosito/flutter-action@9a48871cbeff8679f6337339dc79b806ad9a9a13 # v2.9.1
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Build the Android app
        run: flutter build apk --debug
