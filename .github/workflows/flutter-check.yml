# Flutter check on the working branches. Analyze and test ONLY, no Shorebird,
# no publishing, no secrets.
#
# Why this exists: the "CI" workflow is the React Native app (npm), and the
# only job that ever ran `flutter test` on a GitHub runner was the preview
# publisher, which runs on main alone. So a test that passed in the dev
# sandbox but failed on a runner stayed invisible until after the merge, and
# a failing preview build silently shipped nothing. That happened: one test
# assumed the machine had no internet, and thirteen stamps of work never
# reached the phone.
#
# This runs the same analyze and test steps on the branch, so a runner-only
# failure shows up BEFORE the merge, on the PR, where it is cheap to fix.

name: Flutter check

on:
  push:
    branches:
      - 'claude/**'
  # Every pull request to main, so a PR from ANY branch (a fork, or a branch
  # not named claude/**) still gets a verdict. Without this, "runs on every PR"
  # quietly depended on the branch matching the push filter above.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# No paths filter ON PURPOSE, even though it means running the suite on a
# docs-only push. A workflow skipped by a paths filter shows up as NO CHECK
# rather than a red X, and an absent check reads as approval at a glance. That
# is how a whole batch of work could end on a docs commit whose head carried
# no Flutter check at all. Two minutes of free runner time is a fair price for
# every commit on the branch carrying a real verdict.

# Running on BOTH push and pull_request would normally double every check on a
# claude/** branch that has a PR open. The concurrency group below prevents
# that: it keys on the SOURCE branch, which both events resolve to
# (github.head_ref for a pull_request, github.ref_name for a push), so the two
# events for the same commit land in the same group and the newer cancels the
# older. Net result: every PR gets exactly one check, from whichever event
# fired last, and a claude/** push with no PR still gets its pre-PR check.
#
# Cancelling is safe here because nothing publishes (unlike the preview
# publisher, which must always finish).
concurrency:
  group: flutter-check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the native-change detection below can find the
          # merge base with main. The default shallow clone has no merge base
          # at all, and the check would then either always fire or never fire,
          # which is worse than not having it.
          fetch-depth: 0

      - uses: subosito/flutter-action@9a48871cbeff8679f6337339dc79b806ad9a9a13 # v2.9.1
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      # Delivery guard. The publisher (flutter-preview.yml) installs Shorebird
      # with this EXACT pinned action, but only on main after merge, so a broken
      # pin surfaced only at the base-APK build, the most expensive place. It
      # cost the f3.05 delivery one failed run: a tail-1 mis-pin to v1.2.x, whose
      # install script dies under the runner's /bin/sh. This installs it here,
      # pre-merge, so a bad pin reddens the PR. Installing needs no
      # SHOREBIRD_TOKEN (that is only for publishing), so it is safe on the
      # branch check.
      - name: Shorebird installs (delivery-tooling smoke test)
        uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1 (v1.0.1)

      # The smoke test above proves the pin IT references installs. This proves
      # the publisher references the SAME pin, so the two cannot drift: bumping
      # only the publisher to a broken version would otherwise ship a pin the
      # smoke test never exercised.
      - name: Publisher and this check pin Shorebird identically
        working-directory: .
        run: |
          check=$(grep -oE 'setup-shorebird@[0-9a-f]{40}' .github/workflows/flutter-check.yml | head -1)
          pub=$(grep -oE 'setup-shorebird@[0-9a-f]{40}' .github/workflows/flutter-preview.yml | head -1)
          echo "check:     $check"
          echo "publisher: $pub"
          if [ -z "$check" ] || [ "$check" != "$pub" ]; then
            echo "The branch check and the publisher pin setup-shorebird to different SHAs."
            echo "The smoke test then proves a pin that is not the one that ships. Make them match."
            exit 1
          fi

      # Delivery guard, the second half of the flavor split. The publisher hands
      # --flavor to `shorebird release/patch`, and Shorebird needs a matching
      # entry under flavors: in shorebird.yaml to resolve an app_id. Without it,
      # release and patch cannot find the app and delivery breaks on main, the
      # founder's only live channel, and it breaks INVISIBLY here because the
      # branch check never runs a real shorebird release. This asserts, pre-merge
      # and statically, that every flavor the publisher passes to a shorebird
      # command is mapped. It caught exactly this: --flavor preview was wired
      # into the publisher while shorebird.yaml still had no flavors: map.
      - name: Every Shorebird flavor is mapped in shorebird.yaml
        working-directory: .
        run: |
          flavors=$(grep -oE 'shorebird +(release|patch) +android[^|&]*--flavor +[A-Za-z0-9_]+' \
            .github/workflows/flutter-preview.yml \
            | grep -oE '\-\-flavor +[A-Za-z0-9_]+' | awk '{print $2}' | sort -u)
          echo "Flavors the publisher passes to shorebird: ${flavors:-<none>}"
          if [ -z "$flavors" ]; then
            echo "No shorebird --flavor usage found; nothing to check."
            exit 0
          fi
          # Isolate the flavors: block (from the flavors: line to the next
          # top-level key), so an unrelated indented line cannot satisfy it and
          # an absent flavors: map yields an empty block that fails every flavor.
          block=$(awk '/^flavors:/{f=1;next} /^[^[:space:]#]/{f=0} f' flutter/shorebird.yaml)
          missing=
          for f in $flavors; do
            echo "$block" | grep -qE "^[[:space:]]+$f:" || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "flutter/shorebird.yaml has no flavors: entry for:$missing"
            echo "shorebird release/patch --flavor <f> needs flavors.<f> in shorebird.yaml,"
            echo "or delivery on main cannot resolve an app_id. Add the mapping."
            exit 1
          fi
          echo "All shorebird flavors are mapped in shorebird.yaml."

      - name: Analyze (zero tolerance)
        run: flutter analyze

      - name: Test
        run: flutter test

      # The screenshot harness is deliberately excluded from `flutter test`
      # (it is not named *_test.dart), so nothing else ever runs it. That is
      # the same silence that let it be abandoned once already: it appeared to
      # hang, the reason was never written down, and the founder was the only
      # pair of eyes on this app for two rounds.
      #
      # analyze covers the compile-time half, a renamed screen constructor
      # breaks the build above. This covers the RUNTIME half: that the real
      # fonts still load and a screen still renders.
      #
      # --update-goldens is load-bearing, not a shortcut. The harness ends in
      # matchesGoldenFile and test/shots/ is gitignored, so without the flag a
      # fresh checkout compares against a file that does not exist and fails
      # for a reason that says nothing about the app. With it, the step only
      # writes, and the only way it can fail is if the harness genuinely
      # stopped working.
      - name: The screenshot harness still renders
        run: flutter test test/screens_shot.dart --update-goldens

      # The deterministic golden baselines, COMPARED (no --update-goldens). A
      # small committed pixel baseline for the screens the UI work touched.
      #
      # continue-on-error on purpose: this is a VISUAL REFERENCE, not the gate.
      # The real regression protection is the layout-metric tests in the `Test`
      # step (screen_readability_test, palette_contrast, and the per-fix widget
      # tests), which measure layout, not pixels, and cannot flake across
      # machines. Pixel goldens are generated on one Linux box and compared on
      # another, and CLAUDE.md is emphatic that a check which cries wolf gets its
      # battery pulled, so this reports a drift (its own named, non-blocking
      # step) without ever blocking a merge on a sub-pixel difference. A real
      # visual regression still shows here, and the failure_*.png diffs are
      # uploaded below for a look. See flutter/test/golden/README.md.
      - name: UI golden baselines (visual reference, non-blocking)
        id: goldens
        continue-on-error: true
        run: flutter test test/golden/ui_golden.dart

      - name: Upload golden diffs when they drift
        if: steps.goldens.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-diffs
          path: flutter/test/golden/**/failures/**
          if-no-files-found: ignore

      # Compile Android, but ONLY when the native side of the app changed.
      #
      # A launch audit found the order was backwards: nothing here ever ran
      # Gradle, so the first Android compile of a native change happened on
      # main, inside the publisher, AFTER the merge. For a change that costs
      # the founder a manual APK install, discovering a build failure there is
      # the most expensive possible moment.
      #
      # Gated on the paths, because a Gradle build is minutes and the vast
      # majority of pushes here are pure Dart. --debug, not --release: it
      # proves the plugins resolve and the manifest merges without needing the
      # signing config or publishing anything.
      - name: Did the native side change
        id: native
        working-directory: .
        run: |
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -z "$BASE" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE"...HEAD \
              | grep -qE '^flutter/(android/|pubspec\.yaml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # --flavor preview: the app has two flavors now (preview and prod), so a
      # flavorless build is ambiguous and fails. preview is what the founder
      # runs, so it is the one to compile here.
      - name: Android actually compiles
        if: steps.native.outputs.changed == 'true'
        run: flutter build apk --debug --flavor preview

      # The shipped manifest is not the source manifest: plugins merge in their
      # own permissions and components at build time. This reads the MERGED
      # manifest that the debug build just produced and holds it to an
      # allowlist (permissions, exported components, backup off with both rule
      # files, no cleartext). Debug and release agree on all of these, and this
      # is the PRE-MERGE gate, so an unexpected permission reddens the PR rather
      # than being discovered on the phone. The script's logic is itself tested
      # on the branch by flutter/test/merged_manifest_guard_test.dart.
      #
      # A missing manifest fails loudly rather than passing: an unverified
      # manifest must never read as a verified one.
      - name: The merged manifest matches the allowlist
        if: steps.native.outputs.changed == 'true'
        working-directory: .
        run: |
          # Search the APP module only. Every plugin also emits its own merged
          # library manifest under flutter/build/<plugin>/..., and those have no
          # app-level allowBackup, so a search across all of flutter/build can
          # grab the wrong file. The app module is flutter/build/app.
          #
          # The variant is previewDebug now (flavor + build type), so the
          # intermediates dir is .../merged_manifest/previewDebug/... . Match it
          # case-insensitively, and fall back to any merged app manifest.
          MANIFEST=$(find flutter/build/app -type f -name AndroidManifest.xml \
            -path '*merged_manifest*' 2>/dev/null | grep -i 'previewdebug' | head -1)
          if [ -z "$MANIFEST" ]; then
            MANIFEST=$(find flutter/build/app -type f -name AndroidManifest.xml \
              -path '*merged_manifest*' 2>/dev/null | head -1)
          fi
          echo "Merged manifest: ${MANIFEST:-<none found>}"
          bash .github/scripts/check-merged-manifest.sh "$MANIFEST"

      # Informational, never a gate. Unmerged work in progress is completely
      # normal, so failing here would cry wolf on every push.
      #
      # What it fixes is a reporting gap, not a code one: "finished" used to
      # mean the tests passed, and a batch once sat in an open pull request
      # while the founder tapped check-for-update and read back the old stamp.
      # This prints the last stamp that genuinely reached the phone right next
      # to the one on this branch, in the same output, at the moment someone is
      # deciding whether a batch is done.
      - name: Branch stamp vs the stamp actually delivered
        working-directory: .
        run: |
          BRANCH=$(grep -oE "'f[0-9]+\.[0-9]+" flutter/lib/main.dart | head -1 | tr -d "'")
          git fetch --depth=1 origin main || true
          DELIVERED=$(git show origin/main:docs/delivery-log.md 2>/dev/null \
            | grep -oE '\| f[0-9]+\.[0-9]+ \|' | tail -1 | tr -d '| ')
          echo "This branch builds stamp: ${BRANCH:-unknown}"
          echo "Last stamp on the phone:  ${DELIVERED:-none recorded}"
          if [ "$BRANCH" != "$DELIVERED" ]; then
            echo
            echo "These differ, which is normal for work in progress. It stops"
            echo "being normal once the work is finished: finished means merged"
            echo "AND carrying a delivery-log row, not merely green here."
          fi
