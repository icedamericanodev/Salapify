# Flutter preview pipeline. Every push that touches flutter/ builds a signed
# APK on GitHub's free runners and publishes it to ONE fixed release tag,
# flutter-preview. The founder bookmarks that release page on the phone: each
# new build replaces the APK there, and because every build is signed with the
# committed preview key, the new APK installs OVER the old one in place.
# This runs on GitHub's free runner minutes, not the EAS allowance.

name: Flutter preview APK

on:
  push:
    branches:
      # Main only, on purpose. The old fixed working branch claude/salapify-v2
      # used to be listed here too, which meant a second door to the publisher.
      # It is retired; sessions now work on per-session claude/** branches,
      # those run the Flutter check only, and delivery happens at the merge.
      - main
    paths:
      - 'flutter/**'
      # This workflow watches its own definition ON PURPOSE. Without this line
      # a push that edits only the publisher triggers nothing at all: no check
      # and no publish, so the shipping mechanism can be broken, or believed
      # fixed, with zero signal until some later push happens to touch
      # flutter/ and fails there. Editing the publisher must exercise the
      # publisher.
      - '.github/workflows/flutter-preview.yml'
  workflow_dispatch:

# One build at a time, and builds QUEUE rather than cancel: a Shorebird
# release or patch in flight must always finish and reach its publish step,
# otherwise a cancelled first release could exist server-side with no base
# APK ever published, leaving every later green run patching a release
# nobody can install.
concurrency:
  group: flutter-preview
  cancel-in-progress: false

permissions:
  contents: write # needed to update the flutter-preview release
  issues: write # needed to say out loud when a build shipped nothing

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      # Full history: the delivery-log step rebases onto main before pushing,
      # and a depth-1 checkout cannot rebase.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@9a48871cbeff8679f6337339dc79b806ad9a9a13 # v2.9.1
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Analyze (zero tolerance)
        run: flutter analyze

      - name: Test
        run: flutter test

      # Pinned to the commit the moving v1 tag points to, which is v1.0.1 and
      # is the exact version every prior delivery (f3.01 to f3.04) used. Do NOT
      # "upgrade" this to v1.2.x by tag: those newer releases ship an install
      # script that fails under the runner's /bin/sh ("Syntax error: ( unexpected"),
      # which broke the f3.05 base APK once already. A SHA is required by the
      # pinning policy; this is the SHA of the known-good version.
      - uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1 (v1.0.1)

      # Shorebird model: one RELEASE per pubspec version (the base APK the
      # founder installs once), then every later push PATCHES that release
      # over the air, applied when the app restarts. Bump the pubspec version
      # only for native-level changes; that forces a new release and one
      # manual APK install, which the log below calls out loudly.
      - name: Release or patch
        id: ship
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "pubspec version: $VERSION"
          # If the list itself fails (auth, outage), stop loudly rather than
          # guess the wrong branch. Padded match so 0.1.0+1 never matches a
          # future 0.1.0+11 row.
          LIST=$(shorebird releases list) || { echo "shorebird releases list failed; refusing to guess release vs patch."; exit 1; }
          # --no-tree-shake-icons on BOTH commands: with tree-shaking on,
          # using any new Material icon changes the shaken icon-font asset,
          # and Shorebird refuses patches that touch assets
          # (UnpatchableChangeException, the f0.14 failure). Shipping the
          # full icon font in the base costs ~1.6MB once and makes icon
          # changes patchable forever.
          # Output is tee'd so the patch number Shorebird prints ("Published
          # Patch 22!") becomes a machine-readable fact, not something a human
          # has to go read in a log. It is the only place the delivered patch
          # number exists, and it is what the phone shows on the Update stamp
          # row, so it is the one value that lets repo and phone be compared.
          set -o pipefail
          # --flavor preview on BOTH: the app has two flavors now (preview and
          # prod), so a flavorless build is ambiguous. preview is the founder's
          # over-the-air track. The release and every later patch MUST name the
          # same flavor or the patch lands on a release Shorebird cannot match.
          if echo "$LIST" | grep -Fq " $VERSION "; then
            echo "Release $VERSION exists; pushing an over-the-air PATCH."
            shorebird patch android --release-version "$VERSION" --flavor preview --no-confirm -- --no-tree-shake-icons 2>&1 | tee ship.log
            echo "mode=patch" >> "$GITHUB_OUTPUT"
          else
            echo "No release $VERSION yet; building the base APK (founder installs this once)."
            shorebird release android --flavor preview --artifact apk --flutter-version 3.44.6 --no-confirm -- --no-tree-shake-icons 2>&1 | tee ship.log
            echo "mode=release" >> "$GITHUB_OUTPUT"
          fi
          # `|| true` is load-bearing, and its absence cost a whole delivery.
          #
          # grep EXITS 1 when it matches nothing, this step runs under bash -e
          # with pipefail, and a failing command substitution kills the step.
          # On a PATCH run the log always contains "Published Patch N", so this
          # line succeeded 35 times in a row and looked fine. On a RELEASE run
          # there is no such line ANYWHERE in the log, so it exited 1 the first
          # time a release was ever built after this line was added.
          #
          # The damage was not a red tick. It failed AFTER Shorebird had
          # already published the release, so the two steps that matter were
          # both skipped: the base APK was never uploaded to the flutter-preview
          # tag, and no delivery-log row was written. The founder was left with
          # a release that existed everywhere except on their phone, and no way
          # to install it.
          PATCH=$(grep -oE 'Published Patch [0-9]+' ship.log | grep -oE '[0-9]+' | tail -1 || true)
          echo "patch=${PATCH:-}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Did that actually ship anything?
      #
      # The failure notice at the bottom of this file covers a step that exits
      # NON-ZERO. This covers the other half, which nothing covered: a step
      # that exits ZERO having published nothing. On a patch run the patch
      # number is parsed with `|| true` on purpose, so an empty one looks
      # exactly like success, and the delivery row below would be written
      # reading "patch: none" while the phone received nothing.
      #
      # A row in docs/delivery-log.md is the ONE thing this project treats as
      # proof that something shipped. A row that means nothing is worse than no
      # row at all, because it is believed. So this runs BEFORE the row is
      # written, and its failure reaches the founder through the same
      # nothing-shipped issue as any other failure here.
      #
      # The logic lives in a script rather than in this file because a workflow
      # step can only ever be tested by shipping. flutter/test/publisher_guard
      # _test.dart drives that script through every failure shape on the branch
      # check, before the merge, which is the first time any of this has been
      # testable at all.
      #
      # Invoked via `bash` so it cannot quietly stop running the day the
      # executable bit is lost in a checkout or a rebase.
      - name: Prove something actually shipped
        working-directory: .
        run: |
          bash .github/scripts/verify-shipped.sh \
            '${{ steps.ship.outputs.mode }}' \
            '${{ steps.ship.outputs.patch }}' \
            flutter/ship.log \
            flutter/build/app/outputs/flutter-apk/app-preview-release.apk

      - name: Publish the base APK to the fixed flutter-preview release
        if: steps.ship.outputs.mode == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: flutter-preview
          name: Salapify Flutter preview (latest)
          body: |
            The Shorebird-enabled base build. Install this APK ONCE; from then
            on updates patch themselves over the air whenever you reopen the
            app. Check the Update stamp inside the app to confirm which build
            you are on. Built from ${{ github.sha }}.
          prerelease: true
          # Flavored output path: `--flavor preview` writes the APK to
          # app-preview-release.apk, not app-release.apk. Point the upload (and
          # the verify-shipped check above) at the flavored name, or a release
          # run publishes to Shorebird server-side while the founder's release
          # page gets no installable APK, the exact silent-release failure the
          # delivery log exists to catch.
          files: flutter/build/app/outputs/flutter-apk/app-preview-release.apk

      # The delivery record. This exists so "did it actually ship" is answered
      # by reading a file in the repo instead of by interrogating the Actions
      # API, which is slow, easy to get wrong, and unavailable in some
      # sessions. After this, a plain `git pull` tells anyone the stamp and
      # patch number that genuinely reached the phone.
      #
      # It cannot loop: this commit touches only docs/, and this workflow's
      # paths filter is flutter/** plus its own file, so it does not retrigger.
      - name: Record what actually shipped
        if: success() && github.ref == 'refs/heads/main'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ steps.ship.outputs.mode }}
          PATCH: ${{ steps.ship.outputs.patch }}
          APP_VERSION: ${{ steps.ship.outputs.version }}
        working-directory: .
        run: |
          STAMP=$(grep -oE "'f[0-9]+\.[0-9]+" flutter/lib/main.dart | head -1 | tr -d "'")
          WHEN=$(date -u '+%Y-%m-%d %H:%M UTC')
          mkdir -p docs
          # Two different builds must never carry the same name on the Update
          # stamp row. That row is the ONLY thing the founder can check that
          # nobody here can fake, and its whole value is that the stamp on the
          # phone can be compared straight against the last row of this file.
          # Ship twice under one stamp and that comparison silently starts
          # lying: the phone says f2.40 and so does the log, while the phone is
          # actually running the earlier of two different builds.
          #
          # This fails AFTER the publish on purpose. The patch is already out,
          # so refusing to record it would be the worse lie. Fail loudly, and
          # the failure notice at the end of this file opens an issue.
          PREV=$(grep -oE '\| f[0-9]+\.[0-9]+ \|' docs/delivery-log.md 2>/dev/null \
            | tail -1 | tr -d '| ')
          if [ -n "$STAMP" ] && [ "$STAMP" = "$PREV" ]; then
            echo "Stamp $STAMP was already delivered, and this is a different build."
            echo "Bump updateStamp in flutter/lib/main.dart. One stamp, one patch."
            exit 1
          fi
          if [ ! -f docs/delivery-log.md ]; then
            {
              echo "# Delivery log"
              echo
              echo "What actually reached the phone, written by the publisher"
              echo "itself after a successful publish. Newest last."
              echo
              echo "A merge with no line here shipped NOTHING, whatever the"
              echo "pull request said. The patch number is the same one the"
              echo "app shows on its Update stamp row, so this file and the"
              echo "phone can be compared directly."
              echo
              echo "| When | Stamp | Patch | Mode | App version | Commit |"
              echo "|------|-------|-------|------|-------------|--------|"
            } > docs/delivery-log.md
          fi
          printf '| %s | %s | %s | %s | %s | [%s](%s) |\n' \
            "$WHEN" "${STAMP:-unknown}" "${PATCH:-none}" "$MODE" \
            "$APP_VERSION" "$(echo "${{ github.sha }}" | cut -c1-8)" "$RUN_URL" \
            >> docs/delivery-log.md
          git config user.name 'salapify-delivery'
          git config user.email 'noreply@github.com'
          git add docs/delivery-log.md
          git commit -m "Delivery: ${STAMP:-unknown}, patch ${PATCH:-none} [skip ci]" || exit 0
          # main may have moved while the build ran; rebase rather than fail,
          # and never force.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done

      # Keep the release page showing exactly ONE installable APK.
      #
      # A base-APK build uploads app-preview-release.apk to the fixed
      # flutter-preview release. When the artifact filename CHANGES (adding the
      # preview flavor renamed app-release.apk to app-preview-release.apk once
      # already), the old asset is orphaned NEXT TO the new one, the same size,
      # and the founder cannot tell which to install. Tapping the stale one
      # silently installs an old build while everything looks done, the exact
      # silent-delivery confusion the delivery log exists to prevent, and the
      # founder hit it on f3.06. This deletes every .apk on the release whose name
      # is not the current base APK, so only the current file is ever offered.
      #
      # Runs on every successful publish, patch and release, so a stale asset is
      # cleaned on the very next push rather than lingering until the next base
      # APK. continue-on-error because a cleanup hiccup must NEVER block or
      # false-alarm a real delivery: the APK is already published and the row
      # already written by the time this runs, so the worst a failure here does is
      # leave a stale asset, no worse than before this step existed.
      #
      # EXPECTED_APK is hard-coded to match the `files:` path in the publish step
      # above; a future artifact rename must change BOTH together.
      - name: Remove stale base APK assets from the release page
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_APK: app-preview-release.apk
        run: |
          names=$(gh release view flutter-preview --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name | select(endswith(".apk"))') || {
            echo "Could not list release assets; leaving the release page as is."
            exit 0
          }
          for name in $names; do
            if [ "$name" != "$EXPECTED_APK" ]; then
              echo "Deleting stale release asset: $name"
              gh release delete-asset flutter-preview "$name" \
                --repo "$GITHUB_REPOSITORY" --yes \
                || echo "Could not delete $name; leaving it in place."
            fi
          done
          echo "Release page now offers the current base APK: $EXPECTED_APK"

      # These two steps go LAST on purpose. A notice placed before the publish
      # step cannot report a failure IN the publish step, which is the exact
      # blind spot being closed here.
      #
      # A failed run means the founder got NOTHING, while the pull request
      # still looks clean and merged. That silence is how twelve real failures
      # went unnoticed for thirteen stamps. Make it visible: ONE open issue,
      # commented on rather than duplicated, closed by the next green run so it
      # never rots into noise that gets ignored in turn.
      - name: Say plainly that nothing shipped
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Preview build failed, nothing shipped to the phone'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          BODY=$(printf 'The "Flutter preview APK" run for commit %s failed, so no patch was published and the app on the phone did NOT change, whatever the merged pull request suggests.\n\nFailed run: %s\n\nThis issue closes itself on the next green run.' "$SHA" "$RUN_URL")
          OPEN=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      # Mode `release` means a NEW base APK, which the founder must install by
      # hand. If they do not, they receive nothing FOREVER while every build
      # here stays green, which is the most dangerous state this pipeline has,
      # because it looks exactly like success from every angle except the
      # phone. Until now the only warning was a word in a table that a human
      # had to notice and pass on.
      #
      # An issue, not a log line: it arrives as a notification, it stays open
      # until someone closes it, and it says what to do.
      - name: Shout when a new base APK must be installed by hand
        if: success() && steps.ship.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_VERSION: ${{ steps.ship.outputs.version }}
        run: |
          TITLE="Install the new APK by hand, or the phone stops receiving updates"
          BODY=$(printf 'This build published a RELEASE, not a patch, because the app version changed to %s.\n\nOver the air updates cannot cross a release boundary. Until the new APK is installed by hand from the flutter-preview release page, the phone keeps running the OLD build and every future patch lands on a release it is not on. Everything here will keep passing while nothing reaches the phone.\n\nDownload and install: %s/releases/tag/flutter-preview\nBuild: %s\n\nClose this issue once the new APK is installed.' \
            "$APP_VERSION" "${{ github.server_url }}/${{ github.repository }}" "$RUN_URL")
          OPEN=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close the nothing-shipped issue now that delivery works again
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Preview build failed, nothing shipped to the phone'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          OPEN=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "Delivery is working again: $RUN_URL published successfully."
          fi
