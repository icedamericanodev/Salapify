<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; background: #F5EEE3; color: #221A14; -webkit-font-smoothing: antialiased; }
    a { color: #A8390F; text-decoration: none; } a:hover { color: #7F2A0B; }
    .serif { font-family: 'Fraunces', Georgia, serif; }
    .num { font-variant-numeric: tabular-nums; font-weight: 700; }
    .kicker { font-size: 11px; line-height: 14px; letter-spacing: 1.6px; text-transform: uppercase; color: #6B5D51; font-weight: 700; }
    .rule { height: 2px; background: #221A14; margin-top: 8px; }
    .row { display: flex; align-items: baseline; gap: 8px; height: 48px; border-bottom: 1px solid #E3D8C8; }
    .row .l { font-size: 16px; line-height: 22px; white-space: nowrap; }
    .row .c { font-size: 12px; line-height: 16px; color: #6B5D51; white-space: nowrap; }
    .row .lead { flex-grow: 1; border-bottom: 2px dotted #C9BBA8; height: 0.55em; min-width: 16px; }
    .row .a { font-size: 17px; line-height: 22px; font-variant-numeric: tabular-nums; font-weight: 700; }
    .sec { display: flex; justify-content: space-between; align-items: baseline; margin-top: 28px; }
    .header { display: flex; justify-content: space-between; align-items: baseline; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #F5EEE3; border-top: 1px solid #E3D8C8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #9A8C7E; }
    .tab.on { color: #A8390F; }
    .logpill { justify-self: center; width: 64px; height: 44px; border-radius: 999px; background: #A8390F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-shadow: 0 4px 14px rgba(34,26,20,0.18); }
  </style>
</helmet>
<div style="width: 412px; height: 915px; background: #F5EEE3; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <div style="display: flex; flex-direction: column; padding: 52px 24px 0 24px; flex-grow: 1; overflow: hidden;">
    <div class="header">
      <div style="display: flex; align-items: center; gap: 12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#221A14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg><div style="font-size: 24px; line-height: 30px; font-weight: 700;">Utang</div></div>
      <a style="font-size: 14px; font-weight: 700;">+ Add</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #EFE6D8; border-radius: 10px; padding: 4px; margin-top: 18px;">
      <div style="height: 40px; border-radius: 8px; background: #FCF8F1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">Owed to me</div>
      <div style="height: 40px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #9A8C7E;">I owe</div>
    </div>

    <div class="kicker" style="margin-top: 22px;">Owed to you</div>
    <div style="display: flex; align-items: baseline; gap: 6px;">
      <span style="font-size: 22px; line-height: 44px; font-weight: 800; color: #A8390F;">₱</span>
      <span class="serif num" style="font-size: 40px; line-height: 44px; letter-spacing: -1px;">3,500</span>
    </div>
    <div style="font-size: 14px; line-height: 20px; color: #6B5D51;">From 1 person. ₱450 came back this week.</div>

    <div class="sec"><div class="kicker">Open</div></div>
    <div class="rule"></div>
    <div class="row"><span class="l">Kuya Jun</span><span class="c">lent Aug 30 · no date</span><span class="lead"></span><span class="a">3,500</span></div>

    <div class="sec"><div class="kicker">Just settled</div></div>
    <div class="rule"></div>
    <div class="row" style="position: relative;"><span class="l" style="text-decoration: line-through; color: #9A8C7E;">Ate Mae, lunch</span><span class="c" style="color: #9A8C7E;">today</span><span class="lead"></span><span class="a" style="text-decoration: line-through; color: #9A8C7E;">450</span>
      <div style="position: absolute; right: 96px; top: 6px; font-size: 13px; font-weight: 800; letter-spacing: 1.4px; color: #A8390F; border: 2px solid #A8390F; border-radius: 6px; padding: 4px 10px; transform: rotate(-7deg); background: rgba(245,238,227,0.7);">BAYAD NA · PAID</div>
    </div>

    <div class="sec"><div class="kicker">Settled earlier</div></div>
    <div class="rule"></div>
    <div class="row"><span class="l" style="color: #9A8C7E;">Bea, concert ticket</span><span class="c">Aug 12</span><span class="lead"></span><span class="a" style="color: #9A8C7E;">1,800</span></div>
    <div class="row"><span class="l" style="color: #9A8C7E;">Kuya Jun</span><span class="c">Jul 30</span><span class="lead"></span><span class="a" style="color: #9A8C7E;">2,000</span></div>
  </div>
  <div class="bar">
    <div class="tab "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg>Home</div>
    <div class="tab "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"></path></svg>Ledger</div>
    <div class="logpill">Log</div>
    <div class="tab "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Plan</div>
    <div class="tab "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M2 11h20M6 15h3"></path></svg>Accounts</div>
  </div>
</div>
</x-dc>
</body>
</html>
