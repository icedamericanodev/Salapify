<!doctype html>
<html>

<x-dc>
<helmet>

</helmet>
<div style="width: 412px; height: 915px; background: #050506; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative;">
  <div style="position: absolute; top: 56px; left: 20px; right: 20px; opacity: 0.25; display: flex; flex-direction: column; gap: 12px;">
    <div style="height: 40px; display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 12px; color: #A6A4AD;">Thursday, September 11</div><div style="font-size: 16px; font-weight: 600;">Payday in 4 days</div></div>
    <div style="background: #1E1E25; border-radius: 20px; height: 120px;"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;"><div style="background: #16161B; border-radius: 20px; height: 110px;"></div><div style="background: #16161B; border-radius: 20px; height: 110px;"></div></div>
  </div>

  <div style="background: #16161B; border-radius: 28px 28px 0 0; padding: 12px 20px 0 20px; display: flex; flex-direction: column; gap: 16px; height: 600px;">

      <div style="height: 56px; border-radius: 12px; background: #1E1E25; border: 1.5px solid #FF8A3D; display: flex; align-items: center; padding: 0 16px; gap: 10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"></path></svg>
        <div style="font-size: 18px; line-height: 24px; font-weight: 600; color: #F5F4F0; flex-grow: 1;">jollibee 250</div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A6A4AD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path><path d="M19 11a7 7 0 0 1-14 0M12 18v3"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #A6A4AD; padding-left: 4px;">
        <span>Got it:</span><span style="color: #F5F4F0; font-weight: 600;">Expense</span><span>·</span><span class="num" style="color: #F5F4F0;">₱250</span><span>·</span><span style="color: #F5F4F0; font-weight: 600;">Jollibee</span><span>·</span><span style="color: #FF8A3D; font-weight: 600;">Food</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #0D0D10; border-radius: 12px; padding: 4px;">
      <div style="height: 40px; border-radius: 10px; background: #1E1E25; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #F5F4F0;">Expense</div>
      <div style="height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #6E6C77;">Income</div>
      <div style="height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #6E6C77;">Transfer</div>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: center; gap: 4px; padding: 4px 0;">
      <span style="font-size: 20px; line-height: 38px; font-weight: 800; color: #FF8A3D;">₱</span>
      <span class="num" style="font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.5px;">250</span>
      <span class="num" style="font-size: 16px; line-height: 38px; color: #6E6C77;">.00</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 12px; line-height: 16px; color: #A6A4AD;">Category</div>
      <div style="display: flex; gap: 8px; overflow: hidden;">
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #FF8A3D; color: #1A0E05; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap;"><span>🍔</span><span>Food</span></div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #1E1E25; border: 1px solid #26262E; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap;"><span>🚌</span><span>Transport</span></div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #1E1E25; border: 1px solid #26262E; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap;"><span>🛒</span><span>Groceries</span></div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #1E1E25; border: 1px solid #26262E; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap;"><span>💡</span><span>Bills</span></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 12px; line-height: 16px; color: #A6A4AD;">From</div>
      <div style="display: flex; gap: 8px; overflow: hidden;">
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #1E1E25; border: 1px solid #FF8A3D; color: #F5F4F0; display: flex; align-items: center; font-size: 14px; font-weight: 600; white-space: nowrap;">GCash</div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #1E1E25; border: 1px solid #26262E; display: flex; align-items: center; font-size: 14px; font-weight: 600; white-space: nowrap;">Cash</div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #1E1E25; border: 1px solid #26262E; display: flex; align-items: center; font-size: 14px; font-weight: 600; white-space: nowrap;">BPI</div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #1E1E25; border: 1px solid #26262E; display: flex; align-items: center; font-size: 14px; font-weight: 600; white-space: nowrap;">UnionBank Credit</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 44px; border-radius: 12px; background: #1E1E25; display: flex; align-items: center; padding: 0 14px; gap: 8px; font-size: 14px; font-weight: 600;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A6A4AD" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg><span>Today</span></div>
      <div style="height: 44px; border-radius: 12px; background: #1E1E25; display: flex; align-items: center; padding: 0 14px; gap: 8px; font-size: 14px; color: #6E6C77;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A6A4AD" stroke-width="2" stroke-linecap="round"><path d="M4 20h4l10-10-4-4L4 16z"></path></svg><span>Add a note</span></div>
    </div>

    <div style="height: 52px; border-radius: 12px; background: #FF8A3D; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #1A0E05;">Save expense</div>
  </div>
</div>
