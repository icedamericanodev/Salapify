<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; background: #0D0D10; color: #F5F4F0; -webkit-font-smoothing: antialiased; }
    a { color: #FF8A3D; } a:hover { color: #FFA36A; }
    .num { font-variant-numeric: tabular-nums; font-weight: 700; }
    .row { display: flex; align-items: center; gap: 12px; height: 64px; }
    .ic { width: 36px; height: 36px; border-radius: 12px; background: #1E1E25; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .lbl { flex-grow: 1; display: flex; flex-direction: column; gap: 6px; }
    .t { font-size: 16px; line-height: 22px; display: flex; justify-content: space-between; }
    .c { font-size: 12px; line-height: 16px; color: #A6A4AD; }
    .bar { height: 6px; border-radius: 999px; background: #26262E; overflow: hidden; }
    .hr { height: 1px; background: #26262E; }
  </style>
</helmet>
<div style="width: 412px; height: 915px; background: #0D0D10; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 56px 20px 0 20px; flex-grow: 1; overflow: hidden;">

    <div style="font-size: 24px; line-height: 30px; font-weight: 700;">Plan</div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #16161B; border-radius: 12px; padding: 4px;">
      <div style="height: 40px; border-radius: 10px; background: #1E1E25; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">Budget</div>
      <div style="height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #6E6C77;">Upcoming</div>
      <div style="height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #6E6C77;">Goals</div>
    </div>

    <div style="background: #1E1E25; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
      <div style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #A6A4AD;">Left to spend · September</div>
      <div style="display: flex; align-items: baseline; gap: 4px;">
        <span style="font-size: 20px; line-height: 38px; font-weight: 800; color: #FF8A3D;">₱</span>
        <span class="num" style="font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.5px;">6,550</span>
      </div>
      <div class="bar" style="margin-top: 4px;"><div style="width: 74%; height: 6px; background: #FF8A3D;"></div></div>
      <div style="font-size: 14px; line-height: 20px; color: #A6A4AD;">₱18,450 spent of ₱25,000 with 19 days left.</div>
    </div>

    <div style="background: #16161B; border-radius: 20px; padding: 0 16px; display: flex; flex-direction: column;">
      <div class="row"><div class="ic">🍔</div><div class="lbl"><div class="t"><span>Food</span><span class="num" style="font-size: 14px;">₱1,020 left</span></div><div class="bar"><div style="width: 83%; height: 6px; background: #FF8A3D;"></div></div></div></div>
      <div class="hr"></div>
      <div class="row"><div class="ic">🚌</div><div class="lbl"><div class="t"><span>Transport</span><span class="num" style="font-size: 14px;">₱1,640 left</span></div><div class="bar"><div style="width: 45%; height: 6px; background: #FF8A3D;"></div></div></div></div>
      <div class="hr"></div>
      <div class="row"><div class="ic">🛒</div><div class="lbl"><div class="t"><span>Groceries</span><span class="num" style="font-size: 14px; color: #FF6B6B;">₱380 over</span></div><div class="bar"><div style="width: 100%; height: 6px; background: #FF6B6B;"></div></div></div></div>
      <div class="hr"></div>
      <div class="row"><div class="ic">💡</div><div class="lbl"><div class="t"><span>Bills</span><span class="num" style="font-size: 14px;">₱2,340 left</span></div><div class="bar"><div style="width: 61%; height: 6px; background: #FF8A3D;"></div></div></div></div>
      <div class="hr"></div>
      <div class="row"><div class="ic">🎬</div><div class="lbl"><div class="t"><span>Fun</span><span class="num" style="font-size: 14px;">₱1,851 left</span></div><div class="bar"><div style="width: 26%; height: 6px; background: #FF8A3D;"></div></div></div></div>
      <div class="hr"></div>
      <div class="row"><div class="ic">💊</div><div class="lbl"><div class="t"><span>Health</span><span class="num" style="font-size: 14px;">₱1,500 left</span></div><div class="bar"><div style="width: 0%; height: 6px; background: #FF8A3D;"></div></div></div></div>
    </div>

    <div style="font-size: 12px; line-height: 16px; color: #6E6C77; text-align: center; padding: 4px 0;">Tap a category to change its limit</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #16161B; border-top: 1px solid #26262E; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 10px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6C77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg><div style="font-size: 11px; line-height: 14px; font-weight: 600; color: #6E6C77;">Home</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6C77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"></path></svg><div style="font-size: 11px; line-height: 14px; font-weight: 600; color: #6E6C77;">Activity</div></div>
    <div style="display: flex; flex-direction: column; align-items: center;"><div style="width: 56px; height: 56px; border-radius: 999px; background: #FF8A3D; display: flex; align-items: center; justify-content: center; margin-top: -26px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A0E05" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg><div style="font-size: 11px; line-height: 14px; font-weight: 600; color: #FF8A3D;">Plan</div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6E6C77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="3"></rect><path d="M2 11h20M6 15h3"></path></svg><div style="font-size: 11px; line-height: 14px; font-weight: 600; color: #6E6C77;">Accounts</div></div>
  </div>
</div>
</x-dc>
</body>
</html>
