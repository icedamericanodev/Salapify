<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; background: #F5EEE3; color: #221A14; -webkit-font-smoothing: antialiased; }
    a { color: #A8390F; text-decoration: none; } a:hover { color: #7F2A0B; }
    .serif { font-family: 'Fraunces', Georgia, serif; }
    .num { font-variant-numeric: tabular-nums; font-weight: 700; }
    .kicker { font-size: 11px; line-height: 14px; letter-spacing: 1.6px; text-transform: uppercase; color: #6B5D51; font-weight: 700; }
    .rule { height: 2px; background: #221A14; margin-top: 8px; }
    .row { display: flex; align-items: baseline; gap: 8px; height: 48px; border-bottom: 1px solid #E3D8C8; }
    .row .l { font-size: 16px; line-height: 22px; white-space: nowrap; }
    .row .c { font-size: 12px; line-height: 16px; color: #6B5D51; white-space: nowrap; }
    .row .lead { flex-grow: 1; border-bottom: 2px dotted #C9BBA8; height: 0.55em; min-width: 16px; }
    .row .a { font-size: 17px; line-height: 22px; font-variant-numeric: tabular-nums; font-weight: 700; }
    .sec { display: flex; justify-content: space-between; align-items: baseline; margin-top: 28px; }
    .header { display: flex; justify-content: space-between; align-items: baseline; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #F5EEE3; border-top: 1px solid #E3D8C8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #9A8C7E; }
    .tab.on { color: #A8390F; }
    .logpill { justify-self: center; width: 64px; height: 44px; border-radius: 999px; background: #A8390F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-shadow: 0 4px 14px rgba(34,26,20,0.18); }
  </style>
</helmet>
<div style="width: 412px; height: 915px; background: #F5EEE3; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <div style="display: flex; flex-direction: column; padding: 52px 24px 0 24px; flex-grow: 1; overflow: hidden;">
    <div class="header">
      <div class="serif" style="font-size: 28px; line-height: 34px; font-weight: 600; font-style: italic;">Sept, 2nd half</div>
      <div style="font-size: 12px; line-height: 16px; color: #6B5D51; font-weight: 600;">4 days to payday</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #EFE6D8; border-radius: 10px; padding: 4px; margin-top: 18px;">
      <div style="height: 40px; border-radius: 8px; background: #FCF8F1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">Budget</div>
      <div style="height: 40px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #9A8C7E;">Upcoming</div>
      <div style="height: 40px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #9A8C7E;">Goals</div>
    </div>

    <div class="kicker" style="margin-top: 22px;">Left to spend this cycle</div>
    <div style="display: flex; align-items: baseline; gap: 6px;">
      <span style="font-size: 22px; line-height: 44px; font-weight: 800; color: #A8390F;">₱</span>
      <span class="serif num" style="font-size: 40px; line-height: 44px; letter-spacing: -1px;">6,550</span>
    </div>
    <div style="font-size: 14px; line-height: 20px; color: #6B5D51;">₱18,450 spent of ₱25,000 with 19 days left.</div>

    <div class="sec"><div class="kicker">By category</div><a style="font-size: 12px; font-weight: 700;">Edit limits</a></div>
    <div class="rule"></div>
    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid #E3D8C8;"><div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 16px;">🍔 Food</span><span class="lead" style="flex-grow: 1; border-bottom: 2px dotted #C9BBA8; height: 0.55em;"></span><span class="num" style="font-size: 17px;">1,020 left</span></div><div style="height: 4px; background: #E3D8C8;"><div style="width: 83%; height: 4px; background: #221A14;"></div></div></div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid #E3D8C8;"><div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 16px;">🚌 Transport</span><span class="lead" style="flex-grow: 1; border-bottom: 2px dotted #C9BBA8; height: 0.55em;"></span><span class="num" style="font-size: 17px;">1,640 left</span></div><div style="height: 4px; background: #E3D8C8;"><div style="width: 45%; height: 4px; background: #221A14;"></div></div></div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid #E3D8C8;"><div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 16px;">🛒 Groceries</span><span class="lead" style="flex-grow: 1; border-bottom: 2px dotted #C9BBA8; height: 0.55em;"></span><span class="num" style="font-size: 17px; color: #A31D3A;">380 over</span></div><div style="height: 4px; background: #E3D8C8;"><div style="width: 100%; height: 4px; background: #A31D3A;"></div></div></div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid #E3D8C8;"><div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 16px;">💡 Bills</span><span class="lead" style="flex-grow: 1; border-bottom: 2px dotted #C9BBA8; height: 0.55em;"></span><span class="num" style="font-size: 17px;">2,340 left</span></div><div style="height: 4px; background: #E3D8C8;"><div style="width: 61%; height: 4px; background: #221A14;"></div></div></div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid #E3D8C8;"><div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 16px;">🎬 Fun</span><span class="lead" style="flex-grow: 1; border-bottom: 2px dotted #C9BBA8; height: 0.55em;"></span><span class="num" style="font-size: 17px;">1,851 left</span></div><div style="height: 4px; background: #E3D8C8;"><div style="width: 26%; height: 4px; background: #221A14;"></div></div></div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid #E3D8C8;"><div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 16px;">💊 Health</span><span class="lead" style="flex-grow: 1; border-bottom: 2px dotted #C9BBA8; height: 0.55em;"></span><span class="num" style="font-size: 17px;">1,500 left</span></div><div style="height: 4px; background: #E3D8C8;"><div style="width: 0%; height: 4px; background: #221A14;"></div></div></div>
    </div>
  </div>
  <div class="bar">
    <div class="tab "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg>Home</div>
    <div class="tab "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"></path></svg>Ledger</div>
    <div class="logpill">Log</div>
    <div class="tab on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Plan</div>
    <div class="tab "><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="M2 11h20M6 15h3"></path></svg>Accounts</div>
  </div>
</div>
</x-dc>
</body>
</html>
