<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; background: #F5EEE3; color: #221A14; -webkit-font-smoothing: antialiased; }
    a { color: #A8390F; text-decoration: none; } a:hover { color: #7F2A0B; }
    .serif { font-family: 'Fraunces', Georgia, serif; }
    .num { font-variant-numeric: tabular-nums; font-weight: 700; }
    .kicker { font-size: 11px; line-height: 14px; letter-spacing: 1.6px; text-transform: uppercase; color: #6B5D51; font-weight: 700; }
    .rule { height: 2px; background: #221A14; margin-top: 8px; }
    .row { display: flex; align-items: baseline; gap: 8px; height: 48px; border-bottom: 1px solid #E3D8C8; }
    .row .l { font-size: 16px; line-height: 22px; white-space: nowrap; }
    .row .c { font-size: 12px; line-height: 16px; color: #6B5D51; white-space: nowrap; }
    .row .lead { flex-grow: 1; border-bottom: 2px dotted #C9BBA8; height: 0.55em; min-width: 16px; }
    .row .a { font-size: 17px; line-height: 22px; font-variant-numeric: tabular-nums; font-weight: 700; }
    .sec { display: flex; justify-content: space-between; align-items: baseline; margin-top: 28px; }
    .header { display: flex; justify-content: space-between; align-items: baseline; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #F5EEE3; border-top: 1px solid #E3D8C8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #9A8C7E; }
    .tab.on { color: #A8390F; }
    .logpill { justify-self: center; width: 64px; height: 44px; border-radius: 999px; background: #A8390F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-shadow: 0 4px 14px rgba(34,26,20,0.18); }
  </style>
</helmet>
<div style="width: 412px; height: 915px; background: #F5EEE3; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative;">
  <div style="position: absolute; inset: 0; background: rgba(34,26,20,0.40);"></div>
  <div style="position: absolute; top: 52px; left: 24px; right: 24px; display: flex; flex-direction: column;">
    <div class="header"><div class="serif" style="font-size: 28px; line-height: 34px; font-weight: 600; font-style: italic;">Sept, 2nd half</div><div style="font-size: 12px; color: #6B5D51; font-weight: 600;">4 days to payday</div></div>
    <div class="kicker" style="margin-top: 26px;">Safe to spend</div>
    <div style="display: flex; align-items: baseline; gap: 6px;"><span style="font-size: 30px; line-height: 64px; font-weight: 800; color: #A8390F;">₱</span><span class="serif num" style="font-size: 60px; line-height: 64px; letter-spacing: -1.5px;">6,240</span></div>
  </div>

  <div style="position: relative; background: #FCF8F1; border-radius: 24px 24px 0 0; padding: 12px 24px 0 24px; display: flex; flex-direction: column; gap: 16px; height: 640px; box-shadow: 0 -8px 32px rgba(34,26,20,0.16);">
    <div style="width: 36px; height: 4px; border-radius: 999px; background: #E3D8C8; align-self: center;"></div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 56px; border-radius: 10px; background: #F5EEE3; border: 1.5px solid #A8390F; display: flex; align-items: center; padding: 0 16px; gap: 10px;">
        <span style="font-size: 20px; font-weight: 800; color: #A8390F;">+</span>
        <div style="font-size: 18px; line-height: 24px; font-weight: 600; flex-grow: 1;">jollibee 250</div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5D51" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path><path d="M19 11a7 7 0 0 1-14 0M12 18v3"></path></svg>
      </div>
      <div style="font-size: 12px; line-height: 16px; color: #6B5D51; padding-left: 4px;">Got it: <b style="color: #221A14;">Expense</b> · <b style="color: #221A14;">₱250</b> · <b style="color: #221A14;">Jollibee</b> · <b style="color: #A8390F;">Food</b></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #EFE6D8; border-radius: 10px; padding: 4px;">
      <div style="height: 40px; border-radius: 8px; background: #FCF8F1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">Expense</div>
      <div style="height: 40px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #9A8C7E;">Income</div>
      <div style="height: 40px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #9A8C7E;">Transfer</div>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: center; gap: 4px;">
      <span style="font-size: 20px; font-weight: 800; color: #A8390F;">₱</span>
      <span class="num" style="font-size: 40px; line-height: 44px; font-weight: 800; letter-spacing: -0.5px;">250</span>
      <span class="num" style="font-size: 16px; color: #9A8C7E;">.00</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="kicker">Category</div>
      <div style="display: flex; gap: 8px; overflow: hidden;">
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #A8390F; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; white-space: nowrap;"><span>🍔</span>Food</div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #F5EEE3; border: 1px solid #E3D8C8; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap;"><span>🚌</span>Transport</div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #F5EEE3; border: 1px solid #E3D8C8; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap;"><span>🛒</span>Groceries</div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #F5EEE3; border: 1px solid #E3D8C8; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap;"><span>💡</span>Bills</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="kicker">From</div>
      <div style="display: flex; gap: 8px; overflow: hidden;">
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #F5EEE3; border: 1.5px solid #A8390F; display: flex; align-items: center; font-size: 14px; font-weight: 700; white-space: nowrap;">GCash</div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #F5EEE3; border: 1px solid #E3D8C8; display: flex; align-items: center; font-size: 14px; font-weight: 600; white-space: nowrap;">Cash</div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #F5EEE3; border: 1px solid #E3D8C8; display: flex; align-items: center; font-size: 14px; font-weight: 600; white-space: nowrap;">BPI</div>
        <div style="height: 36px; padding: 0 14px; border-radius: 999px; background: #F5EEE3; border: 1px solid #E3D8C8; display: flex; align-items: center; font-size: 14px; font-weight: 600; white-space: nowrap;">UnionBank Credit</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 44px; border-radius: 10px; background: #F5EEE3; border: 1px solid #E3D8C8; display: flex; align-items: center; padding: 0 14px; font-size: 14px; font-weight: 600;">Today</div>
      <div style="height: 44px; border-radius: 10px; background: #F5EEE3; border: 1px solid #E3D8C8; display: flex; align-items: center; padding: 0 14px; font-size: 14px; color: #9A8C7E;">Add a note</div>
    </div>

    <div style="height: 52px; border-radius: 10px; background: #A8390F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Save expense</div>
  </div>
</div>
</x-dc>
</body>
</html>
