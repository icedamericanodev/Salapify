<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; background: #14121A; color: #F4F1F8; -webkit-font-smoothing: antialiased; }
    a { color: #2DD4BF; } a:hover { color: #5EEAD4; }
    .num { font-variant-numeric: tabular-nums; font-weight: 900; }
    .card { background: #201D2A; border-radius: 28px; padding: 20px; }
    .ph { background: #2A2636; border-radius: 999px; height: 12px; }
  </style>
</helmet>
<div style="width: 412px; height: 915px; background: #14121A; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 56px 20px 0 20px; flex-grow: 1; overflow: hidden;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 22px; line-height: 28px; font-weight: 900;">Hi, Carla 👋</div>
      <div style="width: 44px; height: 44px; border-radius: 999px; background: #201D2A;"></div>
    </div>
    <div class="card" style="background: #2DD4BF; color: #0B2E2A; display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 14px; font-weight: 700; opacity: 0.8;">Safe to spend</div>
      <div class="num" style="font-size: 44px; line-height: 48px;">₱6,240</div>
      <div style="font-size: 14px; font-weight: 700; opacity: 0.8;">₱1,560 a day until payday</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
      <div class="card" style="display: flex; flex-direction: column; gap: 10px;"><div class="ph" style="width: 60%;"></div><div class="num" style="font-size: 22px;">₱184k</div><div class="ph" style="width: 40%; background: #2DD4BF; opacity: 0.6;"></div></div>
      <div class="card" style="display: flex; flex-direction: column; gap: 10px;"><div class="ph" style="width: 70%;"></div><div class="num" style="font-size: 22px;">₱18,450</div><div class="ph" style="width: 80%;"></div></div>
    </div>
    <div class="card" style="display: flex; flex-direction: column; gap: 14px;">
      <div style="font-size: 16px; font-weight: 900;">Coming up</div>
      <div style="display: flex; align-items: center; gap: 12px;"><div style="width: 44px; height: 44px; border-radius: 999px; background: #2A2636;"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;"><div class="ph" style="width: 50%;"></div><div class="ph" style="width: 30%; height: 8px;"></div></div><div class="num" style="font-size: 15px;">₱2,340</div></div>
      <div style="display: flex; align-items: center; gap: 12px;"><div style="width: 44px; height: 44px; border-radius: 999px; background: #2A2636;"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;"><div class="ph" style="width: 40%;"></div><div class="ph" style="width: 30%; height: 8px;"></div></div><div class="num" style="font-size: 15px;">₱149</div></div>
      <div style="display: flex; align-items: center; gap: 12px;"><div style="width: 44px; height: 44px; border-radius: 999px; background: #2A2636;"></div><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;"><div class="ph" style="width: 45%;"></div><div class="ph" style="width: 30%; height: 8px;"></div></div><div class="num" style="font-size: 15px; color: #2DD4BF;">₱42,000</div></div>
    </div>
    <div class="card" style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 16px; font-weight: 900;">Utang</div>
      <div class="ph" style="width: 70%;"></div><div class="ph" style="width: 50%;"></div>
    </div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 20px; height: 68px; background: #201D2A; border-radius: 999px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; justify-items: center;">
    <div style="width: 24px; height: 24px; border-radius: 8px; background: #2DD4BF;"></div>
    <div style="width: 24px; height: 24px; border-radius: 8px; background: #2A2636;"></div>
    <div style="width: 52px; height: 52px; border-radius: 999px; background: #2DD4BF;"></div>
    <div style="width: 24px; height: 24px; border-radius: 8px; background: #2A2636;"></div>
    <div style="width: 24px; height: 24px; border-radius: 8px; background: #2A2636;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
