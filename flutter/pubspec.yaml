name: salapify
description: "A new Flutter project."
publish_to: 'none'
# Bumped for the "Your Number" home screen widget: the home_widget plugin, a
# new manifest receiver, and new Kotlin. A Shorebird patch carries Dart code
# only, so none of that can travel over the air. This is a fresh base APK the
# founder installs once by hand, and until they do they receive NOTHING while
# every later build reports green. Say that loudly, never bury it.
#
# BOTH halves move. The +11 is the Android versionCode and it must increase or
# the new APK will refuse to install over the old one.
#
# Earlier bumps: Pan's redrawn artwork (assets are not patchable either), and
# flutter_local_notifications plus timezone on top of local_auth for App Lock.
version: 0.6.3+12

environment:
  sdk: ^3.12.2

dependencies:
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^8.1.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.9.3
  local_auth: ^2.3.0
  path_provider: ^2.1.6
  pdf: ^3.11.1
  share_plus: ^10.1.4
  shared_preferences: ^2.5.5
  shorebird_code_push: ^2.0.7
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    # Pan's four mood faces. Listed as a directory so a fifth mood is a file
    # drop rather than another pubspec edit, which is the kind of edit that
    # gets forgotten and ships a missing asset.
    - assets/pan/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
