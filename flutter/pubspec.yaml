name: salapify
description: "A new Flutter project."
publish_to: 'none'
# Bumped for Pan's rendered artwork (assets/pan/, four mood faces, 53KB).
# Shorebird patches carry Dart code, NOT assets, and refuse a patch that
# touches them, so adding an image is a native-level change: a fresh base APK
# that the founder installs once by hand. Everything after that install goes
# back to patching over the air.
#
# The previous bump was flutter_local_notifications + timezone on top of
# local_auth for App Lock.
version: 0.6.0+9

environment:
  sdk: ^3.12.2

dependencies:
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^8.1.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  path_provider: ^2.1.6
  pdf: ^3.11.1
  share_plus: ^10.1.4
  shared_preferences: ^2.5.5
  shorebird_code_push: ^2.0.7
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    # Pan's four mood faces. Listed as a directory so a fifth mood is a file
    # drop rather than another pubspec edit, which is the kind of edit that
    # gets forgotten and ships a missing asset.
    - assets/pan/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
