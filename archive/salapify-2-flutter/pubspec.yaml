name: salapify
description: "Offline first budget, debt, and utang tracker for the Philippines. No account, no cloud, your money data stays on your phone."
publish_to: 'none'
# Bumped for Phase 1 PR1, the Android privacy contract: the secure-window
# method channel (new Kotlin in MainActivity.kt), the two backup-rules XML
# resources wired into the manifest, and the explicit targetSdk = 36 are all
# NATIVE. A Shorebird patch carries Dart only, so none of this can travel over
# the air. This is a fresh base APK the founder installs once by hand, and
# until they do they receive NOTHING while every later build reports green.
# Say that loudly, never bury it.
#
# BOTH halves move. The +14 is the Android versionCode and it must increase or
# the new APK will refuse to install over the old one.
#
# Earlier bumps: PR B2, the encrypted-at-rest store (sqflite_sqlcipher plus
# flutter_secure_storage, 0.7.0+13); the "Your Number" home screen widget
# (home_widget, a manifest receiver, Kotlin); Pan's redrawn artwork (assets are
# not patchable either); and flutter_local_notifications plus timezone on top of
# local_auth.
version: 0.9.5+20

environment:
  sdk: ^3.12.2

dependencies:
  animations: ^2.2.0
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^8.1.2
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.2
  flutter_spinkit: ^5.2.2
  home_widget: ^0.9.3
  local_auth: ^2.3.0
  path_provider: ^2.1.6
  sqflite_sqlcipher: ^3.1.0+1
  pdf: ^3.11.1
  share_plus: ^10.1.4
  shared_preferences: ^2.5.5
  shorebird_code_push: ^2.0.7
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    # Pan's rendered emotion faces, listed as a directory so a new feeling is a
    # file drop rather than another pubspec edit, which is the kind of edit that
    # gets forgotten and ships a missing asset.
    - assets/pan/emotions/
    # Institution wordmark logos and symbols, shown ONLY to identify a user's
    # own account (nominative use, non-affiliation notice on the accounts
    # screen). A directory so adding a bank is a file drop, not a pubspec edit.
    - assets/institutions/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # The ledger face: row and reference amounts and the PDF statement. Same
    # weight ladder (400/600/700) the display roles use, so only the face
    # changes, never a weight. See Barako.ledgerFont.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    # The mono face: masked card numbers and reference/receipt blocks. Ships
    # 400/600. See Barako.monoFont.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
