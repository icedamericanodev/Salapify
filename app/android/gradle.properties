org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# BUILT-IN KOTLIN IS ON (2026-10-11). The Flutter template wrote false, which
# makes Flutter apply the old Kotlin Gradle Plugin (KGP) to every module, and
# made the build warn that share_plus applies KGP and a future Flutter will
# refuse to build it. AGP 9 compiles Kotlin itself, Flutter 3.47+ supports
# that, and share_plus 13.3.1 stops applying KGP when this is true. The app's
# own build.gradle.kts never applied KGP, so nothing else changes.
# If a later plugin applies KGP itself, the build will name it.
android.builtInKotlin=true
