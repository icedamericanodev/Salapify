name: salapify
description: "Salapify 3. An offline budget and debt tracker for the Philippines."
publish_to: 'none'

# versionName + versionCode. The Android side reads BOTH from this one line and
# nowhere else, so this file is the only place a version is set.
#
# It starts at +1, and that is D4 rather than a fresh-project default. The
# founder chose on 2026-09-13 that v3 installs BESIDE their daily app under its
# own applicationId, so this build never has to out-rank the shipped app's +20
# and the two version lines have nothing to do with each other. It was briefly
# +21 for the opposite plan.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Four packages, and the list is checked rather than inherited: these are
# exactly what `grep "^import 'package:'" lib/` reports, with nothing carried
# over on the assumption that the old app needed it.
#
# The money engine still contributes ZERO of them. All 66 files in
# lib/core/money import nothing at all, not even Flutter, which is why the
# golden suite runs in seconds.
#
# The old app also carried csv, excel, pdf, fl_chart, animations and
# flutter_spinkit. v3 drops all six: charts are drawn by hand under one
# grammar (D9), and export returns in Phase E if it is missed.
dependencies:
  flutter:
    sdk: flutter

  # The encrypted ledger. SQLCipher over SQLite, holding the JSON document.
  sqflite_sqlcipher: ^3.1.0+1
  # Where the database key lives: EncryptedSharedPreferences, wrapped by a key
  # the Android Keystore holds. Deliberately NOT behind biometrics, per ADR
  # 0001: App Lock is the UI gate, and a sensor reset must never cost data.
  flutter_secure_storage: ^9.2.2
  # The app documents directory the database file sits in.
  path_provider: ^2.1.6
  # The original storage engine, still read during the one-time migration and
  # still the home of the few keys that must NEVER live inside the ledger blob.
  shared_preferences: ^2.5.5
  go_router: ^18.0.1
  # Backup out, and backup in. The same pair the shipped app uses, so the file
  # a founder exports from one and imports into the other travels a proven
  # path. Both are NATIVE plugins: adding them forces a full rebuild rather
  # than a hot restart, and later a new base APK.
  #
  # An export leaves the app's private storage as readable JSON, which is a
  # deliberate decision rather than an oversight. Founder direction,
  # 2026-09-15, taken after being shown exactly what the file contains: every
  # transaction, account names and balances, card last four digits, account
  # holder names, and any hidden accounts. Encrypting it was offered and
  # declined for now, because a lost password on an offline app with no server
  # is its own total data loss. See D22 in docs/revamp/07-decisions.md.
  share_plus: ^10.1.4
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Plus Jakarta Sans, the one family (D7). Copied from flutter/assets/fonts,
  # which is where the licence and the four weights already live.
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
